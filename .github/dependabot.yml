# Weekly updates for the workflows' actions (pinned to commits) and the Python
# dependencies in uv.lock. Minor and patch updates come as one pull request per
# ecosystem, major ones each on their own. A release waits a week before it is
# proposed, so a bad or compromised one has time to be caught upstream.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
