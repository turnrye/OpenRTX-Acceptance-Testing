name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Codec2 for the M17 voice tests, Dire Wolf to check APRS packets
        run: sudo apt-get update && sudo apt-get install -y codec2 direwolf
      - run: uv sync
      - run: uv run pytest
      - name: Robot self-test on the simulated bench
        run: uv run robot --outputdir runs/selftest --xunit xunit.xml acceptance/selftest.robot
      - name: Bench self-test, looped back on the simulated bench
        run: >-
          uv run robot --outputdir runs/selftest-bench
          --prerunmodifier oat.expand.Expand:radios/c62.yaml
          -v RADIO:radios/c62.yaml -v BENCH:bench/sim.yaml
          -v CALIBRATION:calibration/sim.yaml -v FIRMWARE:sim
          -v HARDWARE:sim -v DSP:sim acceptance/selftest-bench.robot
      - name: Audio and M17 receive suites on the simulated bench
        run: >-
          uv run robot --outputdir runs/sim-suites
          --prerunmodifier oat.expand.Expand:radios/c62.yaml
          -v RADIO:radios/c62.yaml -v BENCH:bench/sim.yaml
          -v CALIBRATION:calibration/sim.yaml -v FIRMWARE:sim
          -v HARDWARE:sim -v DSP:sim acceptance/fm/audio.robot
          acceptance/m17/rx.robot acceptance/audio-levels.robot
      # The scripted operator answers yes to every inbox question, so rx.robot
      # only shows its packets go out; performance.robot's frames are decoded
      # by the simulated TNC (Dire Wolf), with fewer frames to stay quick
      - name: APRS suites on the simulated bench, as an MD-UV3x0
        run: >-
          uv run robot --outputdir runs/sim-aprs
          --prerunmodifier oat.expand.Expand:radios/mduv3x0.yaml
          -v RADIO:radios/mduv3x0.yaml -v BENCH:bench/sim.yaml
          -v CALIBRATION:calibration/sim.yaml -v FIRMWARE:sim
          -v HARDWARE:sim -v DSP:sim
          -v FRAMES:10 -v STRESS_FRAMES:5 -v SWEEP_STEP:6 -v SOAK_FRAMES:20
          acceptance/aprs/rx.robot acceptance/aprs/performance.robot
      - name: APRS suites resolve their keywords
        run: >-
          uv run robot --dryrun --outputdir runs/dryrun-aprs
          --prerunmodifier oat.expand.Expand:radios/cs7000p.yaml
          -v RADIO:radios/cs7000p.yaml -v BENCH:bench/sim.yaml
          -v CALIBRATION:calibration/sim.yaml -v FIRMWARE:dryrun
          -v HARDWARE:dryrun -v DSP:dryrun acceptance/aprs
      - name: Suites resolve their keywords
        run: >-
          uv run robot --dryrun --outputdir runs/dryrun
          --prerunmodifier oat.expand.Expand:radios/c62.yaml
          -v RADIO:radios/c62.yaml -v BENCH:bench/sim.yaml
          -v CALIBRATION:calibration/sim.yaml -v FIRMWARE:dryrun
          -v HARDWARE:dryrun -v DSP:dryrun acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robot-results
          path: runs/
  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
