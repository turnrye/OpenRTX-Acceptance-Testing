# Publishes the results website with the standard tools: rebot writes each
# run's log and report (linked to its suite on GitHub by oat.sanitize.SourceLink),
# and robotframework-dashboard indexes every run,
# grouped by radio, filterable by firmware and radio (and by the suite
# metadata: firmware name, station, calibration), linking to each run's log.
# Runs under results/ are already sanitized (scripts/export-run.sh).

name: Results site

on:
  push:
    branches: [main]
    paths: ["results/**", "src/oat/sanitize.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Commits of merged pull requests, so logs can link to the suite as it
      # ran (oat.sanitize.SourceLink)
      - run: git fetch origin '+refs/pull/*/head:refs/remotes/pull/*'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Build the site
        run: |
          set -euo pipefail
          mkdir -p _site
          # results/<firmware>/<radio>/<run>/output.xml
          find results -name output.xml | sort | while read -r out; do
            dir=$(dirname "$out")
            firmware=$(cut -d/ -f2 <<< "$dir")
            radio=$(cut -d/ -f3 <<< "$dir")
            run=$(basename "$dir")
            # rebot exits with the number of failed tests. SourceLink links
            # the log to the suite on GitHub at the run's commit.
            uv run rebot --prerebotmodifier oat.sanitize.SourceLink \
              --outputdir "_site/$dir" --output NONE --log log.html \
              --report report.html "$out" > /dev/null || [ $? -le 250 ]
            # The dashboard names a run after its file, output_<alias>.xml
            cp "$out" "output_${firmware}_${run}.xml"
            uvx --from robotframework-dashboard robotdashboard \
              -o "output_${firmware}_${run}.xml:project_${radio}" \
              --customfilters "Firmware=${firmware}:Radio=${radio}" \
              --uselogs true --logurl "$dir/log.html" \
              -d results.db -g false -l false > /dev/null
          done
          cd _site
          uvx --from robotframework-dashboard robotdashboard -d ../results.db \
            -n index.html -t "OpenRTX acceptance results" --uselogs true \
            -l false > /dev/null
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
