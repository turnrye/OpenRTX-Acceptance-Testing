# Publishes the results website with the standard tools: rebot writes each
# run's log and report (linked to its suite on GitHub by oat.sanitize.SourceLink),
# and robotframework-dashboard indexes every run,
# grouped by radio, filterable by firmware and radio (and by the suite
# metadata: firmware name, station, calibration), linking to each run's log.
# Runs under results/ are already sanitized (scripts/export-run.sh).

name: Results site

# Pull requests build the site without deploying it, so a dashboard or
# workflow change is tried before it reaches main
on:
  push:
    branches: [main]
    paths: &site-inputs
      - "results/**"
      - "src/oat/sanitize.py"
      - ".github/workflows/pages.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths: *site-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Commits of merged pull requests, so logs can link to the suite as it
      # ran (oat.sanitize.SourceLink). Not into refs/remotes/pull/: checkout
      # of a pull request already made refs/remotes/pull/<n>/merge there
      - run: git fetch origin '+refs/pull/*/head:refs/remotes/pull-heads/*'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group site
      - name: Build the site
        run: |
          set -euo pipefail
          mkdir -p _site
          # results/<firmware>/<radio>/<run>/output.xml
          find results -name output.xml | sort | while read -r out; do
            dir=$(dirname "$out")
            firmware=$(cut -d/ -f2 <<< "$dir")
            radio=$(cut -d/ -f3 <<< "$dir")
            run=$(basename "$dir")
            # rebot exits with the number of failed tests. SourceLink links
            # the log to the suite on GitHub at the run's commit.
            uv run rebot --prerebotmodifier oat.sanitize.SourceLink \
              --outputdir "_site/$dir" --output NONE --log log.html \
              --report report.html "$out" > /dev/null || [ $? -le 250 ]
            # The dashboard names a run after its file, output_<alias>.xml
            cp "$out" "output_${firmware}_${run}.xml"
            uv run --group site robotdashboard \
              -o "output_${firmware}_${run}.xml:project_${radio}" \
              --customfilters "Firmware=${firmware}:Radio=${radio}" \
              --uselogs true --logurl "$dir/log.html" \
              -d results.db -g false -l false > /dev/null
          done
          cd _site
          uv run --group site robotdashboard -d ../results.db \
            -n index.html -t "OpenRTX acceptance results" --uselogs true \
            -l false > /dev/null
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
