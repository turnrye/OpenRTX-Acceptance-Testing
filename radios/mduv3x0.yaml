# TYT MD-UV380/MD-UV390 (OpenRTX target mduv3x0). FM, M17 and, on 2m, APRS
# (OpenRTX#559 receives APRS through the FM settings, at 25 kHz). 2m is the
# North American APRS frequency, so APRS tests run where the radio expects
# them; everything here is conducted, through the bench's attenuators.
name: TYT MD-UV3x0
max_tx_power_dbm: 37          # 5 W
dsp_image: false
bands:
  2m:
    frequency_hz: 144390000
    modes: [fm, m17, aprs]
  70cm:
    frequency_hz: 445975000
    modes: [fm, m17]
modes: [fm, m17, aprs]
# Power settings left out until the radio's are known: power tests skip

# Acceptance limits as for the C62 (radios/c62.yaml)
fm:
  # Limits per channel bandwidth, keyed as OpenRTX names them. These are
  # acceptance criteria, not regulations. Peak deviation is the 99.9th
  # percentile; occupied bandwidth holds 99% of the power, and its limit is
  # the necessary bandwidth of the usual emission designators (11K0F3E and
  # 16K0F3E). CTCSS deviation follows TIA-603-E table 75 (nominal 350 and
  # 500 Hz).
  BW_12_5:
    max_peak_deviation_hz: 2500
    max_occupied_bandwidth_hz: 11000
    ctcss_deviation_hz: [350, 600]
  BW_25:
    max_peak_deviation_hz: 5000
    max_occupied_bandwidth_hz: 16000
    ctcss_deviation_hz: [500, 1000]
  # Largest CTCSS frequency error, as a fraction of the tone
  ctcss_frequency_tolerance: 0.005
  # Audio, through an interface on the accessory connector (needs:audio).
  # The response limits follow the shape TIA-603-E gives for FM voice
  # radios: within +1/-3 dB of a 6 dB/octave pre-emphasis on transmit, and
  # of the matching de-emphasis on receive, from 300 to 3000 Hz, referred to
  # 1 kHz. They, the distortion limit (TIA-603-E's 5%) and the rest are used
  # as acceptance criteria.
  tx_audio_response:
    band_hz: [300, 3000]
    slope_db_per_octave: 6
    tolerance_db: [-3, 1]
  rx_audio_response:
    band_hz: [300, 3000]
    slope_db_per_octave: -6
    tolerance_db: [-3, 1]
  tx_max_thd_n_percent: 5
  rx_max_thd_n_percent: 5
  # Spread of the deviation one injected tone gives after each of several
  # cold boots: the mic path must come up the same every time
  mic_level_max_spread_db: 1.0
  # Longest dropout in received audio, as when a key press interrupts it
  rx_max_dropout_s: 0.05
  # Deviation for sensitivity and level tests, per bandwidth: 60% of the
  # peak limit, the usual reference modulation
  test_deviation_hz: {BW_12_5: 1500, BW_25: 3000}

aprs:
  # Messages the inbox holds (CONFIG_MESSAGES_MAX_ENTRIES in OpenRTX#559's
  # hwconfig.h): APRS-RX-4 sends more traffic than this
  inbox_entries: 32
  # Acceptance criteria, not from a standard. At the bench's level, with
  # nominal deviation and no twist, every frame is heard; across the
  # stress cases (twist within 6 dB, deviation 1.5-4.5 kHz, short TXDELAY,
  # off-frequency, clock error, back to back) at least this fraction is
  min_frame_rate: 1.0
  min_stress_frame_rate: 0.95

m17:
  # The M17 Protocol Specification (part I, v2.0.2, sections "4-level
  # Frequency-shift Keying Modulation" and "Dibit, Symbol, and
  # Frequency-shift") sets the nominal values: outer symbols at +-2.4 kHz,
  # inner at +-0.8 kHz (a ratio of 3), 4800 symbols/s, a 40 ms preamble and a
  # 12.5 kHz minimum channel spacing. It gives no tolerances: the ranges here
  # are acceptance criteria. Deviations are read at the symbol instants after
  # the receive RRC filter.
  outer_deviation_hz: [2280, 2520]    # 2400 Hz +-5%
  deviation_ratio: [2.85, 3.15]       # 3 +-5%
  max_symbol_rate_error_ppm: 100
  # Keeps the 9 kHz the specification gives M17 inside a 12.5 kHz channel,
  # which leaves (12.5 - 9) / 2 = 1.75 kHz
  max_frequency_error_hz: 1000
  max_evm_percent: 10
  # The necessary bandwidth of a 12.5 kHz channel, as for FM BW_12_5 (11K0);
  # an ideal signal at nominal deviation measures about 9.3 kHz
  max_occupied_bandwidth_hz: 11000
  min_preamble_s: 0.04                # the specification's "shall"
