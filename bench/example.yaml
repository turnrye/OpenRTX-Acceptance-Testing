# A bench: the instruments around the radio under test. The losses of the
# cables and attenuators between them are in a calibration file instead.
# Copy to bench/<name>.local.yaml (ignored by git) and edit for your setup.

# Short public name for this bench, recorded in results
station: my-bench

receiver:
  type: rtlsdr          # rtlsdr, hackrf, sim or replay
  gain_db: 0           # 0 means the lowest manual gain, not rtl_sdr's automatic gain
  rate: 250000          # samples/s; 2000000 or more for a HackRF
  # Tune below the signal, so the receiver's DC spike stays off the channel
  tune_offset_hz: -75000

# One HackRF can be both, so the attenuator chain never moves: receiver
# type: hackrf with lna_db: 0 and vga_db: 0 to start (raise them if the power
# test reads weak; it fails if the HackRF clips), rate: 2000000 and
# tune_offset_hz: -250000. Two HackRFs need a serial: each.

transmitter:
  type: hackrf          # hackrf or sim
  tx_vga_db: 0          # 0-47 dB; the RF amp stays off unless amp: true
  amp: false
  rate: 2000000
  tune_offset_hz: -250000

operator:
  type: console         # console, or file to answer prompts through files
  directory: runs/operator

# The USB sound interface on the radio's accessory connector, for the tests
# tagged needs:audio: test audio into the mic input, the speaker captured.
# ALSA device names from `aplay -L` and `arecord -L`. An AIOC also keys the
# radio: ptt names its serial port and the line that keys (DTR on an AIOC,
# with RTS low). Without ptt, the operator keys. Leave the section out on a
# bench without an interface and run with --exclude needs:audio.
#audio:
#  type: alsa
#  playback_device: plughw:CARD=AllInOneCable,DEV=0
#  capture_device: plughw:CARD=AllInOneCable,DEV=0
#  rate: 48000
#  ptt: {device: /dev/ttyACM0, line: dtr}
#  # The radio's volume for the tests that record its speaker, set once per
#  # run (Set Radio Volume Once) and recorded with the results. With
#  # target_dbfs the operator turns the knob while the run measures the
#  # speaker playing a 1 kHz FM tone, until it reads the target; without it
#  # the operator just sets a volume and says where the knob is.
#  radio_volume:
#    target_dbfs: -12              # speaker level through the interface
#    tolerance_db: 1
#    reference_deviation_hz: 3000  # 1 kHz tone, 60% of 25 kHz deviation
#    #reference_level_dbm: -60     # with a calibrated transmitter
#    note: start near 12 o'clock   # shown to the operator
